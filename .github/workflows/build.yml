name: Build Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0

    steps:
      - uses: actions/checkout@v4

      - name: Build Firmware
        run: |
          . ${IDF_PATH}/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Prepare Artifacts
        run: |
          mkdir -p firmware
          cp build/mibee_cam.bin firmware/
          cp build/bootloader/bootloader.bin firmware/
          cp build/partition_table/partition-table.bin firmware/
          cp build/ota_data_initial.bin firmware/
          cp build/spiffs.bin firmware/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: firmware/
          retention-days: 14
