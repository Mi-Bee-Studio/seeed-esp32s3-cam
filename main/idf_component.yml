## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  espressif/esp32-camera: ~2.1.7
  espressif/mdns: '*'
  # 水印 JPEG 解码（issue #11；与 ai-thinker 的传递依赖同源同版本）
  espressif/esp_jpeg: ~1.3.1
  # espp/rtsp is vendored in components/espp__rtsp (patched: digest auth,
  # TCP interleaved, max_sessions, mbedtls REQUIRES) — do not re-add here.
  # Its former private dependencies are declared directly instead:
  espp/base_component: '*'
  espp/socket: '*'
  espp/task: '*'
