<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiBee Cam 首次配置</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#FAFAFA;color:#333;font-size:14px;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:420px;padding:20px 16px}
.header{text-align:center;margin-bottom:20px}
.header h1{font-size:20px;color:#7C3AED;font-weight:700}
.header p{font-size:13px;color:#999;margin-top:4px}
.steps{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
.step{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;background:#e8e8e8;color:#aaa;transition:all .3s}
.step.active{background:#7C3AED;color:#fff;box-shadow:0 2px 8px rgba(124,58,237,.3)}
.step.done{background:#7C3AED;color:#fff;opacity:.7}
.step-line{width:24px;height:2px;background:#e8e8e8;align-self:center;transition:background .3s}
.step-line.done{background:#7C3AED}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 12px rgba(124,58,237,.1);margin-bottom:16px}
.card-title{font-size:16px;color:#7C3AED;font-weight:600;margin-bottom:16px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:13px;color:#666;margin-bottom:4px;font-weight:500}
.field input[type="text"],
.field input[type="password"],
.field input[type="number"],
.field select{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;background:#fafafa;color:#333;transition:border-color .2s,background .2s}
.field input:focus,.field select:focus{outline:none;border-color:#7C3AED;background:#fff;box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.field .hint{font-size:11px;color:#999;margin-top:3px}
.btn-row{display:flex;gap:10px;margin-top:4px}
.btn{flex:1;padding:12px 16px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s,opacity .15s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#7C3AED;color:#fff}
.btn-primary:hover:not(:disabled){background:#5B21B6}
.btn-secondary{background:#f0f0f0;color:#666}
.btn-secondary:hover:not(:disabled){background:#e0e0e0}
.btn-skip{background:transparent;color:#999;flex:0;padding:12px 8px}
.btn-skip:hover{color:#666}
.step-content{display:none;animation:fadeIn .25s ease}
.step-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.success-icon{text-align:center;margin:16px 0}
.success-icon span{font-size:48px;display:inline-block;background:#F3F0F6;width:80px;height:80px;line-height:80px;border-radius:50%;color:#7C3AED}
.success-msg{text-align:center;font-size:15px;color:#333;margin-bottom:8px;font-weight:500}
.success-sub{text-align:center;font-size:13px;color:#999;margin-bottom:20px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:8px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;font-weight:500}
.toast.show{opacity:1}
.toast.success,.toast.ok{background:#7C3AED;color:#fff}
.toast.error,.toast.err{background:#e74c3c;color:#fff}
.net-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;background:#4CAF50;box-shadow:0 0 4px rgba(76,175,80,.5);transition:background .3s,box-shadow .3s;vertical-align:middle}
.net-dot.offline{background:#e74c3c;box-shadow:0 0 4px rgba(231,76,60,.5);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.loading{text-align:center;padding:20px 0;color:#999;font-size:14px}
.loading span{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="wrap">
<div class="header">
<h1>MiBee Cam <span class="net-dot" id="netDot"></span></h1>
<p>首次配置向导</p>
</div>

<!-- Step Indicator -->
<div class="steps" id="stepIndicator">
<div class="step active" data-step="1">1</div>
<div class="step-line"></div>
<div class="step" data-step="2">2</div>
<div class="step-line"></div>
<div class="step" data-step="3">3</div>
<div class="step-line"></div>
<div class="step" data-step="4">4</div>
</div>

<!-- Step 1: WiFi -->
<div class="card">
<div class="step-content active" data-step="1">
<div class="card-title">WiFi 配置</div>
<div class="field">
<label>WiFi 名称 (SSID)</label>
<input type="text" id="wifi_ssid" placeholder="输入WiFi名称" autocomplete="off">
</div>
<div class="field">
<label>WiFi 密码</label>
<input type="password" id="wifi_pass" placeholder="输入WiFi密码" autocomplete="off">
</div>
<div class="btn-row">
<button class="btn btn-secondary" disabled style="visibility:hidden">返回</button>
<button class="btn btn-primary" onclick="nextStep(1)">下一步</button>
</div>
</div>

<!-- Step 2: Recording -->
<div class="step-content" data-step="2">
<div class="card-title">录制参数</div>
<div class="field">
<label>分辨率</label>
<select id="resolution">
<option value="0">QVGA (320x240)</option>
<option value="1" selected>VGA (640x480)</option>
<option value="2">SVGA (800x600)</option>
<option value="3">UXGA (1600x1200)</option>
</select>
</div>
<div class="field">
<label>帧率 (FPS)</label>
<input type="number" id="fps" value="10" min="1" max="30" placeholder="1-30">
<div class="hint">建议 10-15 fps</div>
</div>
<div class="field">
<label>JPEG 质量 (10-63)</label>
<input type="number" id="jpeg_quality" value="12" min="10" max="63" placeholder="10-63">
<div class="hint">数值越小质量越高，建议 10-20</div>
</div>
<div class="btn-row">
<button class="btn btn-secondary" onclick="prevStep(2)">返回</button>
<button class="btn btn-primary" onclick="nextStep(2)">下一步</button>
</div>
</div>

<!-- Step 3: NAS (optional) -->
<div class="step-content" data-step="3">
<div class="card-title">NAS 上传配置</div>
<div class="field">
<label>上传方式</label>
<select id="nas_type">
<option value="0">-- 禁用 --</option>
<option value="webdav">WebDAV</option>
</select>
</div>
<div id="nasFields" style="display:none">
<div class="field">
<label>服务器 URL</label>
<input type="text" id="nas_url" placeholder="http://192.168.1.100:5005">
</div>
<div class="field">
<label>上传路径</label>
<input type="text" id="nas_path" placeholder="/MiBee Cam">
</div>
<div class="field">
<label>用户名</label>
<input type="text" id="nas_user" placeholder="webdav用户名">
</div>
<div class="field">
<label>密码</label>
<input type="password" id="nas_pass" placeholder="webdav密码">
</div>
</div>
<div class="btn-row">
<button class="btn btn-secondary" onclick="prevStep(3)">返回</button>
<button class="btn btn-skip" onclick="skipNas()">跳过</button>
<button class="btn btn-primary" onclick="nextStep(3)">下一步</button>
</div>
</div>

<!-- Step 4: Done -->
<div class="step-content" data-step="4">
<div class="success-icon"><span>&#10003;</span></div>
<div class="success-msg">配置完成！</div>
<div class="success-sub">正在保存配置并进入主界面...</div>
<div class="loading"><span>&#9889;</span> 保存中...</div>
</div>
</div>
</div>

<script>
var toastTimer=null;
function showToast(msg,type,duration){
 type=type||'success';duration=duration||3000;
 var t=document.getElementById('toast');if(!t)return;
 t.textContent=msg;t.className='toast show '+type;
 clearTimeout(toastTimer);
 toastTimer=setTimeout(function(){t.className='toast'},duration);
}

function updateNetDot(online){
 var d=document.getElementById('netDot');if(!d)return;
 d.className='net-dot '+(online?'online':'offline');
 d.title=online?'网络已连接':'网络已断开';
}
window.addEventListener('offline',function(){updateNetDot(false)});
window.addEventListener('online',function(){updateNetDot(true)});
updateNetDot(navigator.onLine);

var currentStep=1;
var totalSteps=4;
var nasSkipped=false;

function $(s){return document.getElementById(s)}

function updateSteps(){
 for(var i=1;i<=totalSteps;i++){
  var s=document.querySelector('.step[data-step="'+i+'"]');
  var line=s?s.nextElementSibling:null;
  if(!s)continue;
  s.classList.remove('active','done');
  if(i<currentStep){s.classList.add('done')}
  else if(i===currentStep){s.classList.add('active')}
  if(line&&line.classList&&i<currentStep){line.classList.add('done')}
  else if(line&&line.classList){line.classList.remove('done')}
 }
 for(var i=1;i<=totalSteps;i++){
  var c=document.querySelector('.step-content[data-step="'+i+'"]');
  if(c)c.classList.toggle('active',i===currentStep);
 }
}

function nextStep(step){
 if(step===1){
  var ssid=$('wifi_ssid').value.trim();
  if(!ssid){showToast('请输入WiFi名称','error');return}
 }
 if(step===2){
  var f=parseInt($('fps').value);
  if(isNaN(f)||f<1||f>30){showToast('帧率范围 1-30','error');return}
  var q=parseInt($('video_quality').value);
  var q=parseInt($('jpeg_quality').value);
 }
 if(step===3){
  var t=$('nas_type').value;
  if(t!=='0'&&!nasSkipped){
   var url=$('nas_url').value.trim();
   if(!url){showToast('请输入服务器URL','error');return}
  }
 }
 currentStep=step+1;
 updateSteps();
 if(currentStep===4){
  setTimeout(saveAllConfig,500);
 }
}

function prevStep(step){
 currentStep=step-1;
 updateSteps();
}

function skipNas(){
 nasSkipped=true;
 currentStep=4;
 updateSteps();
 setTimeout(saveAllConfig,500);
}

function saveAllConfig(){
 var t=$('nas_type').value;
 var cfg={
  wifi_ssid:$('wifi_ssid').value.trim(),
  wifi_pass:$('wifi_pass').value,
  resolution:parseInt($('resolution').value),
  fps:parseInt($('fps').value),
  jpeg_quality:parseInt($('jpeg_quality').value),
  webdav_enabled:t==='webdav',
  webdav_url:$('nas_url').value.trim(),
  upload_base_path:$('nas_path').value.trim(),
  webdav_user:$('nas_user').value.trim(),
  webdav_pass:$('nas_pass').value
 };
 fetch('/api/config',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify(cfg)
 }).then(function(r){return r.json()}).then(function(d){
  if(d.ok){
   return fetch('/api/setup/done',{method:'POST'});
  }else{
   showToast('保存失败: '+(d.error||'未知错误'),'error');
   currentStep=3;updateSteps();
   throw new Error(d.error);
  }
 }).then(function(){
  showToast('配置已保存，即将跳转...');
  setTimeout(function(){window.location.href='/'},1500);
 }).catch(function(e){
  if(e.message!=='abort')console.error('Save failed:',e);
 });
}

$('nas_type').onchange=function(){
 $('nasFields').style.display=this.value==='webdav'?'block':'none';
};
</script>
</body>
</html>
