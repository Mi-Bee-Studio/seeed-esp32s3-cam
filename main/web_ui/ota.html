<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiBee Cam OTA 更新</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%237C3AED'/%3E%3Cpath d='M10 22V10l16 6-16 6z' fill='white'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#FAFAFA;color:#333;font-size:14px}
.header{background:#7C3AED;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px}
.header h1{font-size:16px;font-weight:600}
.header .ver{font-size:12px;opacity:.7}
.header a{color:#fff;text-decoration:none;font-size:12px;opacity:.8;margin-left:auto}
.header a:hover{opacity:1}
.main{padding:12px;max-width:600px;margin:0 auto;padding-bottom:80px}
.card{background:#fff;border-radius:8px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(124,58,237,.08)}
.card-title{font-size:13px;color:#888;margin-bottom:8px;font-weight:500}
.field{margin-bottom:10px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:13px;color:#666;margin-bottom:4px;font-weight:500}
.field input[type="text"],.field input[type="url"],.field input[type="password"],.field input[type="file"]{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:14px;font-family:inherit;background:#fafafa;color:#333}
.field input:focus{outline:none;border-color:#7C3AED;background:#fff}
.btn{padding:10px 20px;border:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-primary{background:#7C3AED;color:#fff}
.btn-primary:hover{background:#5B21B6}
.btn-primary:disabled{background:#aaa;cursor:not-allowed}
.tabs{display:flex;gap:0;margin-bottom:12px}
.tab{flex:1;padding:8px 4px;border:1px solid #ddd;background:#fafafa;cursor:pointer;font-size:13px;font-family:inherit;color:#666;text-align:center;transition:all .15s}
.tab.active{background:#7C3AED;color:#fff;border-color:#7C3AED;font-weight:500}
.tab:first-child{border-radius:6px 0 0 6px}
.tab:last-child{border-radius:0 6px 6px 0}
.tab:not(:first-child){border-left:none}
.hidden{display:none}
.version-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.version-row .label{color:#888}
.version-row .val{font-weight:500;color:#333}
.progress-wrap{display:none;margin:10px 0}
.progress-wrap.active{display:block}
.progress-track{width:100%;height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:#7C3AED;border-radius:4px;transition:width .3s;width:0%}
.progress-pct{text-align:center;font-size:12px;color:#666;margin-top:4px}
.error-box{display:none;padding:10px 12px;background:#fce4ec;color:#c0392b;border-radius:6px;font-size:13px;margin-top:10px;border:1px solid #f5c6cb}
.error-box.show{display:block}
.error-box .retry{color:#7C3AED;cursor:pointer;text-decoration:underline;margin-left:6px}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:200}
.overlay.hidden{display:none}
.overlay-content{background:#fff;border-radius:12px;padding:32px 24px;text-align:center;max-width:340px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.overlay-content h2{font-size:18px;color:#7C3AED;margin-bottom:8px}
.overlay-content p{font-size:14px;color:#666;margin-bottom:12px;line-height:1.5}
.countdown{font-size:48px;font-weight:700;color:#7C3AED;margin:12px 0}
.countdown-label{font-size:12px;color:#999}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:8px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;font-weight:500}
.toast.show{opacity:1}
.toast.success{background:#7C3AED;color:#fff}
.toast.error{background:#e74c3c;color:#fff}
.toast.warning{background:#e67e22;color:#fff}
.net-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;background:#4CAF50;box-shadow:0 0 4px rgba(76,175,80,.5);transition:background .3s,box-shadow .3s}
.net-dot.offline{background:#e74c3c;box-shadow:0 0 4px rgba(231,76,60,.5);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.spacer{flex:1}
.ver-info{font-size:12px;color:#999;border-top:1px solid #f0f0f0;padding-top:8px;margin-top:8px}
</style>
</head>
<body>

<div class="header">
<span>&#128259;</span>
<h1>MiBee Cam <span class="ver">OTA 更新</span></h1>
<span class="net-dot" id="netDot"></span>
<span style="margin-left:auto;cursor:pointer;font-size:12px;opacity:.8" id="authBtn" onclick="toggleAuth()">&#128274; 登录</span>
</div>

<div class="main">

<!-- Firmware info card -->
<div class="card" id="infoCard">
<div class="card-title">&#8505; 当前固件</div>
<div id="versionInfo">
<div class="version-row"><span class="label">固件版本</span><span class="val" id="fwVersion">--</span></div>
<div class="version-row"><span class="label">App 版本</span><span class="val" id="appVersion">--</span></div>
<div class="version-row"><span class="label">运行分区</span><span class="val" id="runPart">--</span></div>
<div class="version-row"><span class="label">升级分区</span><span class="val" id="nextPart">--</span></div>
<div class="ver-info" id="otaInfoDetail">最大镜像: -- | 运行大小: --</div>
</div>
</div>

<!-- OTA actions card -->
<div class="card">
<div class="card-title">&#128260; 固件更新</div>

<!-- Tabs -->
<div class="tabs">
<button class="tab active" data-tab="url" onclick="switchTab('url')">URL 更新</button>
<button class="tab" data-tab="upload" onclick="switchTab('upload')">上传固件</button>
<button class="tab" data-tab="spiffs" onclick="switchTab('spiffs')">SPIFFS</button>
</div>

<!-- URL mode -->
<div class="tab-panel" id="panelUrl">
<div class="field">
<label>固件下载 URL</label>
<input type="url" id="urlInput" placeholder="http://example.com/mibee_cam.bin">
</div>
<button class="btn btn-primary" id="urlBtn" onclick="startUrlOta()">开始更新</button>
</div>

<!-- Upload firmware mode -->
<div class="tab-panel hidden" id="panelUpload">
<div class="field">
<label>选择固件文件 (.bin)</label>
<input type="file" id="fwFile" accept=".bin">
</div>
<div class="progress-wrap" id="fwProgress">
<div class="progress-track"><div class="progress-fill" id="fwFill"></div></div>
<div class="progress-pct" id="fwPct">0%</div>
</div>
<button class="btn btn-primary" id="fwBtn" onclick="startUpload('firmware')">上传并更新</button>
</div>

<!-- SPIFFS mode -->
<div class="tab-panel hidden" id="panelSpiffs">
<div class="field">
<label>选择 SPIFFS 镜像 (.bin)</label>
<input type="file" id="spiffsFile" accept=".bin">
</div>
<div class="progress-wrap" id="spiffsProgress">
<div class="progress-track"><div class="progress-fill" id="spiffsFill"></div></div>
<div class="progress-pct" id="spiffsPct">0%</div>
</div>
<button class="btn btn-primary" id="spiffsBtn" onclick="startUpload('spiffs')">上传 SPIFFS</button>
<div style="font-size:11px;color:#999;margin-top:8px">上传后页面将重新加载以应用新内容。设备不会重启。</div>
</div>

<!-- Password (shared for all modes) -->
<div style="margin-top:12px">
<div class="field">
<label>管理密码</label>
<input type="password" id="password" placeholder="密码 (默认: admin)">
</div>
</div>

<!-- Error display -->
<div class="error-box" id="errorBox">
<span id="errorMsg"></span>
<span class="retry" id="retryBtn" onclick="clearError()">&#128260; 重试</span>
</div>
</div>

</div>

<!-- Reboot overlay -->
<div class="overlay hidden" id="rebootOverlay">
<div class="overlay-content">
<h2>&#9989; 更新成功</h2>
<p id="overlayMsg">设备正在重启，请稍候...</p>
<div class="countdown" id="rebootCountdown">60</div>
<div class="countdown-label">秒后自动刷新</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== Auth Helpers ===== */
function getStoredPassword(){return localStorage.getItem('cam_password')||''}
function setStoredPassword(p){localStorage.setItem('cam_password',p)}
function clearStoredPassword(){localStorage.removeItem('cam_password')}
function authHeaders(){var p=getStoredPassword();return p?{'X-Password':p}:{}}

function updateAuthUI(){
 var btn=document.getElementById('authBtn');
 if(btn)btn.textContent=getStoredPassword()?'&#128274; 登出':'&#128274; 登录';
}
function toggleAuth(){
 if(getStoredPassword()){clearStoredPassword();updateAuthUI()}
 else{showLoginDialog()}
}
function showLoginDialog(cb){
 var p=prompt('请输入管理密码:');
 if(!p)return;
 fetch('/api/status',{headers:{'X-Password':p}}).then(function(r){
  if(r.ok){setStoredPassword(p);updateAuthUI();if(cb)cb()}
  else{showToast('密码错误','error');showLoginDialog(cb)}
 });
}
function requireAuth(cb){
 var pw=getStoredPassword()||document.getElementById('password').value;
 if(pw)cb();
 else showLoginDialog(cb);
}
function getPassword(){
 return document.getElementById('password').value||getStoredPassword()||'admin';
}

/* ===== Helpers ===== */
function $(s){return document.getElementById(s)}

var toastTimer=null;
function showToast(msg,type,duration){
 type=type||'success';duration=duration||3000;
 var t=$('toast');if(!t)return;
 t.textContent=msg;t.className='toast show '+type;
 clearTimeout(toastTimer);
 toastTimer=setTimeout(function(){t.className='toast'},duration);
}

function updateNetDot(online){
 var d=$('netDot');if(!d)return;
 d.className='net-dot '+(online?'online':'offline');
 d.title=online?'网络已连接':'网络已断开';
}
window.addEventListener('offline',function(){updateNetDot(false)});
window.addEventListener('online',function(){updateNetDot(true)});
updateNetDot(navigator.onLine);

function showError(msg){
 var box=$('errorBox'),txt=$('errorMsg');
 txt.textContent=msg;box.classList.add('show');
}
function clearError(){var b=$('errorBox');if(b)b.classList.remove('show')}

/* ===== Tab switching ===== */
function switchTab(mode){
 document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.add('hidden')});
 document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
 document.querySelector('.tab[data-tab="'+mode+'"]').classList.add('active');
 var panelMap={url:'panelUrl',upload:'panelUpload',spiffs:'panelSpiffs'};
 $(panelMap[mode]).classList.remove('hidden');
 clearError();
}

/* ===== Load version info ===== */
function loadVersionInfo(){
 fetch('/api/ota/info').then(function(r){return r.json()}).then(function(d){
  if(!d.ok){showError('获取版本信息失败');return}
  var v=d.data;
  $('fwVersion').textContent=v.fw_version||'--';
  $('appVersion').textContent=v.app_version||'--';
  $('runPart').textContent=v.running_partition||'--';
  $('nextPart').textContent=v.next_partition||'--';
  $('otaInfoDetail').textContent='最大镜像: '+(v.max_image_size?Math.round(v.max_image_size/1024)+' KB':'--')+' | 运行大小: '+(v.running_size?Math.round(v.running_size/1024)+' KB':'--');
 }).catch(function(e){showError('无法连接到设备');console.error(e)});
}

/* ===== URL-based OTA ===== */
function startUrlOta(){
 var url=$('urlInput').value.trim();
 if(!url){showToast('请输入固件 URL','error');return}
 clearError();
 var btn=$('urlBtn');
 if(btn.dataset.busy==='true')return;
 btn.dataset.busy='true';btn.disabled=true;btn.textContent='更新中...';
 fetch('/api/ota',{
  method:'POST',
  headers:Object.assign({'Content-Type':'application/json'},authHeaders()),
  body:JSON.stringify({url:url})
 }).then(function(r){
  if(r.status===429){showToast('另一个 OTA 操作正在进行中','error');throw new Error('busy')}
  if(r.status===401){showToast('密码错误','error');throw new Error('unauthorized')}
  if(!r.ok){return r.json().then(function(d){throw new Error(d.error||'请求失败')})}
  return r.json();
 }).then(function(){
  showRebootOverlay('固件更新成功，设备正在重启...',60);
 }).catch(function(e){
  if(e.message==='busy'||e.message==='unauthorized'){
   showError(e.message==='busy'?'另一个 OTA 操作正在进行中，请稍后再试':'密码错误');
  }else{
   showToast('更新失败: '+e.message,'error');
   showError(e.message);
  }
  btn.dataset.busy='false';btn.disabled=false;btn.textContent='开始更新';
 });
}

/* ===== Upload OTA (firmware or SPIFFS) ===== */
function startUpload(type){
 var isFw=(type==='firmware');
 var fileInput=$(isFw?'fwFile':'spiffsFile');
 var btn=$(isFw?'fwBtn':'spiffsBtn');
 var progress=$(isFw?'fwProgress':'spiffsProgress');
 var fill=$(isFw?'fwFill':'spiffsFill');
 var pct=$(isFw?'fwPct':'spiffsPct');
 var url=isFw?'/api/ota/upload':'/api/ota/spiffs';

 var file=fileInput.files[0];
 if(!file){showToast('请选择文件','error');return}
 if(!file.name.endsWith('.bin')){showToast('请选择 .bin 文件','error');return}
 clearError();
 if(btn.dataset.busy==='true')return;
 btn.dataset.busy='true';btn.disabled=true;btn.textContent='上传中...';
 progress.classList.add('active');fill.style.width='0%';pct.textContent='0%';

 var pw=$('password').value||getStoredPassword()||'admin';
 var xhr=new XMLHttpRequest();
 xhr.open('POST',url,true);
 xhr.setRequestHeader('X-Password',pw);

 xhr.upload.onprogress=function(e){
  if(e.lengthComputable){
   var p=Math.round(e.loaded/e.total*100);
   fill.style.width=p+'%';
   pct.textContent=p+'% ('+Math.round(e.loaded/1024)+'/'+Math.round(e.total/1024)+' KB)';
  }
 };

 xhr.onload=function(){
  if(xhr.status>=200&&xhr.status<300){
   if(isFw){
    showRebootOverlay('固件上传成功，设备正在重启...',60);
   }else{
    showToast('SPIFFS 上传成功','success');
    setTimeout(function(){window.location.href='/'},3000);
   }
  }else{
   var errMsg='上传失败 ('+xhr.status+')';
   try{
    var resp=xhr.status===429?{error:'OTA 操作正在进行中，请稍后再试'}:JSON.parse(xhr.responseText);
    if(resp.error)errMsg=resp.error;
   }catch(e){}
   if(xhr.status===401)errMsg='密码错误';
   showError(errMsg);
   showToast(errMsg,'error');
   btn.dataset.busy='false';btn.disabled=false;btn.textContent=isFw?'上传并更新':'上传 SPIFFS';
   progress.classList.remove('active');
  }
 };

 xhr.onerror=function(){
  showToast('网络错误','error');
  btn.dataset.busy='false';btn.disabled=false;btn.textContent=isFw?'上传并更新':'上传 SPIFFS';
  progress.classList.remove('active');
 };

 var fd=new FormData();
 fd.append('file',file);
 xhr.send(fd);
}

/* ===== Reboot overlay ===== */
function showRebootOverlay(msg,seconds){
 $('overlayMsg').textContent=msg;
 $('rebootCountdown').textContent=seconds;
 $('rebootOverlay').classList.remove('hidden');
 var remaining=seconds;
 var interval=setInterval(function(){
  remaining--;
  $('rebootCountdown').textContent=remaining;
  if(remaining<=0){
   clearInterval(interval);
   window.location.href='/';
  }
 },1000);
 /* Also probe when device comes back */
 var probeInterval=setInterval(function(){
  fetch('/api/status',{cache:'no-store'}).then(function(r){
   if(r.ok){clearInterval(probeInterval);clearInterval(interval);window.location.href='/'}
  }).catch(function(){});
 },2000);
}

window.onload=function(){loadVersionInfo();updateAuthUI()};
</script>
</body>
</html>
