<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiBee Cam 实时预览</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%237C3AED'/%3E%3Cpath d='M10 22V10l16 6-16 6z' fill='white'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#FAFAFA;color:#333;font-size:14px}
.header{background:#7C3AED;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:8px}
.header h1{font-size:16px;font-weight:600}
.header .ver{font-size:12px;opacity:.7}
.fs-btn{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.fs-btn:hover{background:rgba(255,255,255,.35)}
.main{padding:12px;max-width:860px;margin:0 auto;padding-bottom:80px}
.preview-card{background:#000;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(124,58,237,.12);position:relative}
#stream{width:100%;display:block;background:#000;min-height:200px}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#666;min-height:300px;font-size:15px}
.placeholder .spinner{width:32px;height:32px;border:3px solid #333;border-top-color:#7C3AED;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.status-bar{background:#fff;border-radius:8px;padding:10px 14px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(124,58,237,.08);font-size:13px;flex-wrap:wrap;gap:8px}
.status-left{display:flex;align-items:center;gap:12px}
.status-item{display:flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.on{background:#7C3AED}
.dot.off{background:#e74c3c;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.dot.loading{background:#e67e22;animation:pulse .8s infinite}
.status-label{color:#888}
.status-val{font-weight:500}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10}
.bottom-nav a{flex:1;text-align:center;padding:10px 0;font-size:12px;color:#888;text-decoration:none}
.bottom-nav a.active{color:#7C3AED;font-weight:600}
.bottom-nav a:hover{background:#f5f5f5}
#preview-container:fullscreen .preview-card,#preview-container:-webkit-full-screen .preview-card{border-radius:0;height:100vh;display:flex;align-items:center;justify-content:center}
#preview-container:fullscreen #stream,#preview-container:-webkit-full-screen #stream{max-height:100vh;object-fit:contain}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:8px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;font-weight:500}
.toast.show{opacity:1}
.toast.success,.toast.ok{background:#7C3AED;color:#fff}
.toast.error,.toast.err{background:#e74c3c;color:#fff}
.toast.warning{background:#e67e22;color:#fff}
.toast.info{background:#1565c0;color:#fff}
.net-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;background:#4CAF50;box-shadow:0 0 4px rgba(76,175,80,.5);transition:background .3s,box-shadow .3s}
.net-dot.offline{background:#e74c3c;box-shadow:0 0 4px rgba(231,76,60,.5);animation:pulse 1s infinite}
.preview-controls{position:fixed;bottom:70px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:1000}
.control-btn{width:48px;height:48px;border-radius:50%;background:rgba(124,58,237,.9);color:#fff;border:2px solid #fff;font-size:22px;cursor:pointer;transition:background .2s,transform .15s;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.control-btn:hover{background:#5B21B6;transform:scale(1.08)}
.control-btn:active{transform:scale(.95)}
</style>
</head>
<body>
<div class="header">
<div class="header-left">
<span>&#128247;</span>
<h1>MiBee Cam <span class="ver">实时预览</span></h1>
<span class="net-dot" id="netDot"></span>
</div>
<span style="cursor:pointer;font-size:12px;opacity:.8" id="authBtn" onclick="toggleAuth()">🔒 登录</span>
</div>
<div class="main">
<div id="preview-container">
<div class="preview-card">
<div class="placeholder" id="placeholder">
<div class="spinner"></div>
正在连接摄像头...
</div>
<img id="stream" style="display:none" alt="实时画面">
</div>
</div>
<div class="preview-controls" id="previewControls">
<button class="control-btn" id="fullscreenBtn" onclick="toggleFullscreen()" title="全屏">⛶</button>
<button class="control-btn" id="screenshotBtn" onclick="takeScreenshot()" title="截图">📷</button>
</div>
<div class="status-bar">
<div class="status-left">
<div class="status-item">
<span class="status-label">状态:</span>
<span class="dot loading" id="statusDot"></span>
<span class="status-val" id="statusText">连接中</span>
</div>
<div class="status-item">
<span class="status-label">帧率:</span>
<span class="status-val" id="fps">--</span>
</div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<nav class="bottom-nav">
<a href="/">&#128202; 仪表盘</a>
<a href="/config.html">&#9881; 配置</a>
<a href="/files.html">&#128193; 文件</a>
<a href="/preview.html" class="active">&#128249; 预览</a>
</nav>
<script>
/* ---- Auth Helper ---- */
function getStoredPassword(){return localStorage.getItem('cam_password')||''}
function setStoredPassword(p){localStorage.setItem('cam_password',p)}
function clearStoredPassword(){localStorage.removeItem('cam_password')}
function authHeaders(){var p=getStoredPassword();return p?{'X-Password':p}:{}}
function authFetch(url,opts){opts=opts||{};opts.headers=Object.assign({},opts.headers||{},authHeaders());return fetch(url,opts).then(function(r){if(r.status===401){clearStoredPassword();showLoginDialog();throw new Error('Unauthorized')}return r})}
function showLoginDialog(cb){var p=prompt('请输入管理密码:');if(!p)return;fetch('/api/status',{headers:{'X-Password':p}}).then(function(r){if(r.ok){setStoredPassword(p);updateAuthUI();if(cb)cb()}else{showToast('密码错误','error');showLoginDialog(cb)}})}
function requireAuth(cb){if(getStoredPassword())cb();else showLoginDialog(cb)}
function updateAuthUI(){var btn=document.getElementById('authBtn');if(btn)btn.textContent=getStoredPassword()?'🔓 登出':'🔒 登录'}
function toggleAuth(){if(getStoredPassword()){clearStoredPassword();updateAuthUI()}else showLoginDialog()}

/* ---- Toast & Network Status ---- */
var toastTimer=null;
function showToast(msg,type,duration){
 type=type||'success';duration=duration||3000;
 var t=document.getElementById('toast');if(!t)return;
 t.textContent=msg;t.className='toast show '+type;
 clearTimeout(toastTimer);
 toastTimer=setTimeout(function(){t.className='toast'},duration);
}

function updateNetDot(online){
 var d=document.getElementById('netDot');if(!d)return;
 d.className='net-dot '+(online?'online':'offline');
 d.title=online?'网络已连接':'网络已断开';
}
window.addEventListener('offline',function(){
 updateNetDot(false);showToast('网络已断开','error',5000);
});
window.addEventListener('online',function(){
 updateNetDot(true);showToast('网络已恢复','success');
});
updateNetDot(navigator.onLine);
var img=document.getElementById('stream');
var placeholder=document.getElementById('placeholder');
var statusDot=document.getElementById('statusDot');
var statusText=document.getElementById('statusText');
var fpsEl=document.getElementById('fps');
var connected=false;
var frameCount=0;
var lastTime=Date.now();
var retryTimer=null;

function updateConnected(){
 connected=true;
 clearTimeout(retryTimer);
 placeholder.style.display='none';
 img.style.display='block';
 statusDot.className='dot on';
 statusText.textContent='已连接';
 statusText.style.color='#7C3AED';
}

function updateDisconnected(msg){
 connected=false;
 statusDot.className='dot off';
 statusText.textContent=msg||'连接断开';
 statusText.style.color='#e74c3c';
 if(retryTimer)clearTimeout(retryTimer);
 retryTimer=setTimeout(function(){
  statusDot.className='dot loading';
  statusText.textContent='重新连接中';
  statusText.style.color='#e67e22';
  img.src='http://'+location.hostname+':81/stream?t='+Date.now();
 },3000);
}

img.onload=function(){
 frameCount++;
 updateConnected();
};

img.onerror=function(){
 updateDisconnected('连接断开');
};

img.src='http://'+location.hostname+':81/stream';

setInterval(function(){
 if(!connected)return;
 var now=Date.now();
 var elapsed=now-lastTime;
 if(elapsed>0){
  var f=Math.round(frameCount*1000/elapsed);
  fpsEl.textContent=f+' fps';
 }
 frameCount=0;
 lastTime=now;
},1000);

function toggleFullscreen(){
 var c=document.getElementById('preview-container');
 if(document.fullscreenElement||document.webkitFullscreenElement){
  if(document.exitFullscreen)document.exitFullscreen();
  else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
 }else{
  if(c.requestFullscreen)c.requestFullscreen();
  else if(c.webkitRequestFullscreen)c.webkitRequestFullscreen();
 }
}

function takeScreenshot(){
 var img=document.getElementById('stream');
 if(!img||img.style.display==='none'){showToast('没有可截图的画面','error');return}
 var canvas=document.createElement('canvas');
 canvas.width=img.naturalWidth||640;
 canvas.height=img.naturalHeight||480;
 var ctx=canvas.getContext('2d');
 ctx.drawImage(img,0,0,canvas.width,canvas.height);
 var link=document.createElement('a');
 var ts=new Date().toISOString().replace(/[:.]/g,'-');
 link.download='screenshot_'+ts+'.png';
 link.href=canvas.toDataURL('image/png');
 link.click();
 showToast('截图已保存','success');
}

/* Abort MJPEG stream — release socket before navigating away */
function stopStream(){
 if(retryTimer)clearTimeout(retryTimer);
 img.onload=null;
 img.onerror=null;
 img.src='';
}

/* Nav links: stop stream then navigate */
document.querySelectorAll('.bottom-nav a').forEach(function(a){
 a.addEventListener('click',function(e){
  e.preventDefault();
  stopStream();
  setTimeout(function(){location.href=a.href},80);
 });
});

/* Also stop on back/forward/close */
window.addEventListener('beforeunload',stopStream);
window.addEventListener('pagehide',stopStream);
updateAuthUI();
</script>
</body>
</html>
